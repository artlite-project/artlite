<svg xmlns="http://www.w3.org/2000/svg" width="880" height="372" viewBox="0 0 880 372" role="img" aria-labelledby="t d">
<title id="t">The vision overlay's rows in time</title>
<desc id="d">A schematic of part of a transformer block on the 4 core rows. With host role switches, the LayerNorm runs on rows 4 and 5 only and cross-attention on rows 2 and 3 only, and every switch of rows 4 and 5 to attention and back waits for the array to drain. With pages, every row runs every operation, and a row's page arrives in its B stream just before the operation that needs it, about 2.7 microseconds.</desc>
