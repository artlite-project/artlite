<text x="50" y="195" class="lb">into MM2S 5's start queue</text>
<circle cx="33" cy="220" r="8.5" class="badge code"/>
<text x="33" y="223.6" class="bn code" text-anchor="middle">4</text>
<text x="50" y="224" class="st">Stream</text>
<text x="50" y="240" class="lb">MM2S 5 streams the page into the</text>
<text x="50" y="255" class="lb">core's TileControl</text>
<circle cx="33" cy="280" r="8.5" class="badge code"/>
