<svg xmlns="http://www.w3.org/2000/svg" width="880" height="412" viewBox="0 0 880 412" role="img" aria-labelledby="t d">
<title id="t">A page from the memory tile</title>
<desc id="d">In the decode overlay, the main core of a column requests a page itself: it sends three words through its stream port, a control packet to its memory tile's TileControl that writes the page's buffer descriptor into the start queue of MM2S channel 5, and sleeps on its wake lock. MM2S 5 streams the page from the memory tile's page store into the core's TileControl, which writes the code into the slot, the state words and the wake lock. The host writes the store and its buffer descriptors before a dispatch when they are stale: after the configuration and after a prefill. The helper core pages the same way.</desc>
