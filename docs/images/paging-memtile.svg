#d1efe4}.solid.wts{fill:#1baf7a}.badge.wts{fill:#1baf7a;stroke:#ffffff;stroke-width:2px}.bn.wts{fill:#0d1117}.a.ctl,.w.ctl{stroke:#59636e}.a.ctl{marker-end:url(#hctl)}.card.ctl{fill:#eeeff0;stroke:#a4a9af}.port.ctl{fill:#e4e6e8;stroke:#59636e}.buf.ctl{fill:#dee0e2}.solid.ctl{fill:#59636e}.badge.ctl{fill:#59636e;stroke:#ffffff;stroke-width:2px}.bn.ctl{fill:#ffffff}</style>
