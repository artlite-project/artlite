#0f2d29}.solid.wts{fill:#199e70}.badge.wts{fill:#199e70;stroke:#0d1117;stroke-width:2px}.bn.wts{fill:#0d1117}.a.ctl,.w.ctl{stroke:#9198a1}.a.ctl{marker-end:url(#hctl)}.card.ctl{fill:#1a1e25;stroke:#565b63}.port.ctl{fill:#22272d;stroke:#9198a1}.buf.ctl{fill:#272c33}.solid.ctl{fill:#9198a1}.badge.ctl{fill:#9198a1;stroke:#0d1117;stroke-width:2px}.bn.ctl{fill:#0d1117}</style>
