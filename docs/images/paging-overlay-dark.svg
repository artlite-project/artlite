<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 880 600" role="img" aria-labelledby="t d">
<title id="t">sd15's overlay design</title>
<desc id="d">One configuration runs every operation of Stable Diffusion's UNet. Each row of 8 cores receives one broadcast B stream, commands and the weights of its channel slice, from the shim tile of column 0, 2, 4 or 6. In each column the memory tile holds the activations of that column's tokens: it sends the A stream to each of its 4 cores and receives each core's outputs, the O stream; the shim tile fills the memory tile from DDR and drains it to DDR. The cores run a main loop that executes the commands; the host builds every dispatch's transaction.</desc>
