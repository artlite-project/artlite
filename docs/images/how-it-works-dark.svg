<svg xmlns="http://www.w3.org/2000/svg" width="880" height="456" viewBox="0 0 880 456" role="img" aria-labelledby="t d">
<title id="t">How Artlite runs a model on the NPU</title>
<desc id="d">The host builds each operator's design once (an operator renders C++ and an IRON design per shape, Peano and aiecc compile them into an ELF that configures the array), packs a GGUF file's weights once into a weight image in DRAM at their quantization's size, and every step dispatches a transaction through the C++ runtime and the amdxdna driver. The NPU's 8 columns of shim DMA, memory tile and 4 cores stream the weights and the KV cache from DRAM through one 32 bytes per cycle port, about 57 GB/s, of the 256 GB/s LPDDR5X that the CPU and the iGPU share.</desc>
<style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif}.H{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#9198a1}.h{font-size:10.5px;font-weight:700;letter-spacing:.08em;fill:#6e7681}.n{font-size:10.5px;fill:#6e7681}.t{font-size:12px;font-weight:600;fill:#f0f6fc}.s{font-size:10.5px;fill:#9198a1}.ns{font-size:10px;fill:#9198a1}.b{font-weight:700;fill:#f0f6fc}.p{font-size:10px;fill:#9198a1}.panel{fill:#151b23;stroke:#3d444d}.node{fill:#0d1117;stroke:#3d444d}.pill{fill:#0d1117;stroke:#3d444d}.weights{fill:#0d1117;stroke:#199e70;stroke-opacity:.6}.arrow{fill:none;stroke:#9198a1;stroke-width:1.3;marker-end:url(#head)}.core{fill:#3987e5}.mem{fill:#3987e5;fill-opacity:.45}.shim{fill:#0d1117;stroke:#6e7681}.portbox{fill:#199e70}.flow{fill:none;stroke:#199e70;stroke-width:1.6;stroke-dasharray:4 4;animation:flow 0.9s linear infinite}.port{stroke-width:3}.col{stroke-width:2}@keyframes flow{to{stroke-dashoffset:-8}}@media (prefers-reduced-motion:reduce){.flow{animation:none}}</style>
