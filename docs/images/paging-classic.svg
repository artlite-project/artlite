<svg xmlns="http://www.w3.org/2000/svg" width="880" height="660" viewBox="0 0 880 660" role="img" aria-labelledby="t d">
<title id="t">A classic mlir-aie design</title>
<desc id="d">aiecc compiles a design (C++ kernels and an IRON design) into main.pdi, the configuration of every tile, and insts.bin, the runtime sequence. The NPU's command processor first writes the configuration into the tiles: each core's program memory receives its ELF's code, with its data, locks, DMA buffer descriptors and stream routes. Then each run streams the input from DDR through the shim tile's and the memory tile's DMA channels into the core's data memory, and the core's output back the same way. Another operator is another design: a reset and a full configuration between them.</desc>
