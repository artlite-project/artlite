<svg xmlns="http://www.w3.org/2000/svg" width="880" height="508" viewBox="0 0 880 508" role="img" aria-labelledby="t d">
<title id="t">A page load inside a core tile</title>
<desc id="d">The page arrives in the row's B stream as two B slots that the core's S2MM 1 channel writes into its data memory. The core recognizes the page's header in the first slot, releases its MM2S 1 channel and sleeps on its wake lock. MM2S 1 streams both slots into the stream switch, which routes them, as packets of stream id 7, back into the tile's own TileControl port. TileControl writes the code into the slot of program memory, the pager's state words into data memory, and finally the wake lock. The core wakes, frees the slots, and later calls the page's code through the entry in the state words.</desc>
<style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif}.eb{font-size:10px;font-weight:700;letter-spacing:.1em;fill:#6e7681}.ti{font-size:11.5px;font-weight:600;fill:#f0f6fc}.st{font-size:11px;font-weight:700;fill:#f0f6fc}.lb{font-size:10.5px;fill:#9198a1}.pl{font-size:10px;fill:#9198a1}.sb{font-size:10px;fill:#9198a1}.en{font-size:10.5px;fill:#6e7681}.c{font-size:10px;fill:#f0f6fc}.bn{font-size:10px;font-weight:700}.mo,.sm,.mm{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;font-size:9.5px;fill:#f0f6fc}.sm{font-size:10px;fill:#9198a1}.mm{font-size:10px;fill:#6e7681}.halo,.halop,.halot{paint-order:stroke;stroke:#0d1117;stroke-width:5px;stroke-linejoin:round}.halop{stroke:#151b23}.halot{stroke:#1f252d}.panel{fill:#151b23;stroke:#3d444d}.tile{fill:#1f252d;stroke:#3d444d}.card{fill:#0d1117;stroke:#3d444d}.a,.w{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.w.ctl,.a.ctl{stroke-width:1.3}.hatch{fill:url(#hatch);stroke:#3d444d}.slot{fill:#0d1117;stroke:#d95926;stroke-dasharray:4 3}.axis{fill:none;stroke:#3d444d}.guide{fill:none;stroke:#3d444d;stroke-dasharray:3 3}.resident{fill:#1d2128;stroke:#4f545c}.gcore{fill:#3987e5}.gmem{fill:#214674}.gshim{fill:#0d1117;stroke:#6e7681}.a.data,.w.data{stroke:#3987e5}.a.data{marker-end:url(#hdata)}.card.data{fill:#111d2c;stroke:#255288}.port.data{fill:#142438;stroke:#3987e5}.buf.data{fill:#162940}.solid.data{fill:#3987e5}.badge.data{fill:#3987e5;stroke:#0d1117;stroke-width:2px}.bn.data{fill:#ffffff}.a.code,.w.code{stroke:#d95926}.a.code{marker-end:url(#hcode)}.card.code{fill:#211818;stroke:#7d391f}.port.code{fill:#2e1d19;stroke:#d95926}.buf.code{fill:#361f1a}.solid.code{fill:#d95926}.badge.code{fill:#d95926;stroke:#0d1117;stroke-width:2px}.bn.code{fill:#ffffff}.a.wts,.w.wts{stroke:#199e70}.a.wts{marker-end:url(#hwts)}.card.wts{fill:#0e1f20;stroke:#145f48}.port.wts{fill:#0f2825;stroke:#199e70}.buf.wts{fill:#0f2d29}.solid.wts{fill:#199e70}.badge.wts{fill:#199e70;stroke:#0d1117;stroke-width:2px}.bn.wts{fill:#0d1117}.a.ctl,.w.ctl{stroke:#9198a1}.a.ctl{marker-end:url(#hctl)}.card.ctl{fill:#1a1e25;stroke:#565b63}.port.ctl{fill:#22272d;stroke:#9198a1}.buf.ctl{fill:#272c33}.solid.ctl{fill:#9198a1}.badge.ctl{fill:#9198a1;stroke:#0d1117;stroke-width:2px}.bn.ctl{fill:#0d1117}</style>
<defs><marker id="hdata" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1L9,5L1,9L3.2,5z" fill="#3987e5"/></marker><marker id="hcode" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1L9,5L1,9L3.2,5z" fill="#d95926"/></marker><marker id="hwts" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1L9,5L1,9L3.2,5z" fill="#199e70"/></marker><marker id="hctl" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1L9,5L1,9L3.2,5z" fill="#9198a1"/></marker><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#0d1117"/><line x1="0" y1="0" x2="0" y2="5" stroke="#3d444d" stroke-width="1.6"/></pattern></defs>
<rect x="0.5" y="0.5" width="879" height="507" rx="8" fill="#0d1117" stroke="#3d444d"/>
<rect x="24" y="24" width="576" height="432" rx="10" class="tile"/>
<text x="38" y="44" class="eb">CORE TILE</text>
<text x="108.134" y="44" class="en">(c, r)</text>
<rect x="40" y="52" width="56" height="388" rx="6" class="card"/>
<text x="68" y="70" class="sb" text-anchor="middle">stream</text>
<text x="68" y="83" class="sb" text-anchor="middle">switch</text>
<rect x="120" y="186" width="96" height="32" rx="6" class="card code"/>
<text x="168" y="206" class="ti" text-anchor="middle">TileControl</text>
<rect x="120" y="286" width="96" height="32" rx="6" class="card code"/>
<text x="168" y="306" class="ti" text-anchor="middle">MM2S 1</text>
<rect x="120" y="382" width="96" height="32" rx="6" class="card wts"/>
<text x="168" y="402" class="ti" text-anchor="middle">S2MM 1</text>
<rect x="248" y="52" width="200" height="128" rx="6" class="card"/>
<text x="262" y="72" class="ti">program memory · 16 KB</text>
<rect x="260" y="82" width="176" height="36" rx="4" class="resident"/>
<text x="270" y="97" class="c">resident · 8976 B</text>
<text x="270" y="111" class="sb">main loop, GEMM, conv, pager</text>
<rect x="260" y="126" width="176" height="42" rx="4" class="card code"/>
<text x="270" y="143" class="c">the slot · 7408 B</text>
<text x="270" y="158" class="sb">the page: a, c, v, gn or ln</text>
<rect x="248" y="228" width="200" height="212" rx="6" class="card"/>
<text x="262" y="248" class="ti">data memory · 64 KB</text>
<rect x="260" y="260" width="176" height="26" rx="4" class="buf code"/>
<text x="348" y="276.5" class="mo" text-anchor="middle">state words: page id, entries</text>
<rect x="260" y="316" width="84" height="36" rx="4" class="buf wts"/>
<text x="302" y="331" class="mo" text-anchor="middle">B slot b0</text>
<text x="302" y="345" class="sm" text-anchor="middle">5760 B</text>
<rect x="352" y="316" width="84" height="36" rx="4" class="buf wts"/>
<text x="394" y="331" class="mo" text-anchor="middle">B slot b1</text>
<text x="394" y="345" class="sm" text-anchor="middle">5760 B</text>
<rect x="480" y="52" width="104" height="128" rx="6" class="card"/>
<text x="532" y="84" class="ti" text-anchor="middle">core</text>
<text x="532" y="100" class="sb" text-anchor="middle">main loop</text>
<text x="532" y="136" class="sb" text-anchor="middle">asleep in</text>
<text x="532" y="149" class="sb" text-anchor="middle">the pager</text>
<text x="532" y="162" class="sb" text-anchor="middle">(steps 3-5)</text>
<rect x="480" y="228" width="104" height="212" rx="6" class="card"/>
<text x="494" y="248" class="ti">locks</text>
<rect x="492" y="260" width="80" height="24" rx="4" class="buf ctl"/>
<text x="532" y="275.5" class="mo" text-anchor="middle">9 · wake</text>
<rect x="492" y="292" width="80" height="24" rx="4" class="buf ctl"/>
<text x="532" y="307.5" class="mo" text-anchor="middle">7 · send</text>
<rect x="492" y="324" width="80" height="24" rx="4" class="buf ctl"/>
<text x="532" y="339.5" class="mo" text-anchor="middle">8 · done</text>
<rect x="492" y="356" width="80" height="24" rx="4" class="buf ctl"/>
<text x="532" y="371.5" class="mo" text-anchor="middle">2, 3 · B</text>
<path d="M68,492L68,404Q68,398 74,398L118,398" class="a wts"/>
<text x="80" y="484" class="pl">the row's B stream</text>
<path d="M216,398L296,398Q302,398 302,392L302,354" class="a wts"/>
<path d="M302,398L388,398Q394,398 394,392L394,354" class="a wts"/>
<circle cx="240" cy="398" r="8.5" class="badge wts"/>
<text x="240" y="401.6" class="bn wts" text-anchor="middle">1</text>
<circle cx="262" cy="318" r="8.5" class="badge ctl"/>
<text x="262" y="321.6" class="bn ctl" text-anchor="middle">2</text>
<path d="M532,180L532,226" class="a ctl"/>
<circle cx="552" cy="200" r="8.5" class="badge ctl"/>
<text x="552" y="203.6" class="bn ctl" text-anchor="middle">3</text>
<circle cx="572" cy="200" r="8.5" class="badge ctl"/>
<text x="572" y="203.6" class="bn ctl" text-anchor="middle">6</text>
<path d="M302,316L302,302" class="w code"/>
<path d="M394,316L394,308Q394,302 388,302L218,302" class="a code"/>
<path d="M120,302L86,302Q80,302 80,296L80,208Q80,202 86,202L118,202" class="a code"/>
<circle cx="80" cy="266" r="8.5" class="badge code"/>
<text x="80" y="269.6" class="bn code" text-anchor="middle">4</text>
<text x="80" y="236" class="pl halo" text-anchor="middle">id 7</text>
<path d="M216,202L226,202Q232,202 232,196L232,153Q232,147 238,147L258,147" class="a code"/>
<path d="M216,202L226,202Q232,202 232,208L232,267Q232,273 238,273L258,273" class="a code"/>
<path d="M216,202L458,202Q464,202 464,208L464,266Q464,272 470,272L490,272" class="a code"/>
<circle cx="348" cy="202" r="8.5" class="badge code"/>
<text x="348" y="205.6" class="bn code" text-anchor="middle">5</text>
<path d="M448,116L478,116" class="a ctl"/>
<circle cx="463" cy="98" r="8.5" class="badge ctl"/>
<text x="463" y="101.6" class="bn ctl" text-anchor="middle">7</text>
<circle cx="633" cy="44" r="8.5" class="badge wts"/>
<text x="633" y="47.6" class="bn wts" text-anchor="middle">1</text>
<text x="650" y="48" class="st">Arrive</text>
<text x="650" y="64" class="lb">The row's B stream brings the page:</text>
<text x="650" y="79" class="lb">S2MM 1 writes two B slots, b0 and b1.</text>
<circle cx="633" cy="105" r="8.5" class="badge ctl"/>
<text x="633" y="108.6" class="bn ctl" text-anchor="middle">2</text>
<text x="650" y="109" class="st">Recognize</text>
<text x="650" y="125" class="lb">b0's first word is a page header, not</text>
<text x="650" y="140" class="lb">a command. The core waits for b1.</text>
<circle cx="633" cy="166" r="8.5" class="badge ctl"/>
<text x="633" y="169.6" class="bn ctl" text-anchor="middle">3</text>
<text x="650" y="170" class="st">Sleep</text>
<text x="650" y="186" class="lb">The pager releases lock 7 by 2 and</text>
<text x="650" y="201" class="lb">sleeps on lock 9: no fetches now.</text>
<circle cx="633" cy="227" r="8.5" class="badge code"/>
<text x="633" y="230.6" class="bn code" text-anchor="middle">4</text>
<text x="650" y="231" class="st">Stream</text>
<text x="650" y="247" class="lb">MM2S 1 sends b0, then b1. The switch</text>
<text x="650" y="262" class="lb">routes them into the tile's TileControl.</text>
<circle cx="633" cy="288" r="8.5" class="badge code"/>
<text x="633" y="291.6" class="bn code" text-anchor="middle">5</text>
<text x="650" y="292" class="st">Write</text>
<text x="650" y="308" class="lb">TileControl writes the code into the slot,</text>
<text x="650" y="323" class="lb">the state words, and last, lock 9.</text>
<circle cx="633" cy="349" r="8.5" class="badge ctl"/>
<text x="633" y="352.6" class="bn ctl" text-anchor="middle">6</text>
<text x="650" y="353" class="st">Wake</text>
<text x="650" y="369" class="lb">The core waits for lock 8 (both slots</text>
<text x="650" y="384" class="lb">sent) and frees b0, b1 for commands.</text>
<circle cx="633" cy="410" r="8.5" class="badge ctl"/>
<text x="633" y="413.6" class="bn ctl" text-anchor="middle">7</text>
<text x="650" y="414" class="st">Call</text>
<text x="650" y="430" class="lb">The role's commands call the page</text>
<text x="650" y="445" class="lb">through its entry in the state words.</text>
</svg>
