<text x="628.25" y="149" class="c" text-anchor="middle">the slot · 7408 B</text>
<text x="232" y="176" class="sb">startup, main loop, GEMM, convolution, the pager</text>
<text x="516.5" y="192" class="sb">the pages, each linked at the slot, one loaded at a time</text>
<text x="498.5" y="215" class="lb" text-anchor="end">attention, heads of 80, 160</text>
<text x="366.159" y="215" class="mo" text-anchor="end">a</text>
<rect x="514.5" y="200" width="178.5" height="20" rx="4" class="card code"/>
<text x="701" y="214" class="sm">5776 B</text>
<text x="498.5" y="243" class="lb" text-anchor="end">attention, heads of 40</text>
<text x="389.511" y="243" class="mo" text-anchor="end">c</text>
<rect x="514.5" y="228" width="161" height="20" rx="4" class="card code"/>
<text x="683.5" y="242" class="sm">5216 B</text>
<text x="498.5" y="271" class="lb" text-anchor="end">VAE attention, a head of 512</text>
<text x="356.236" y="271" class="mo" text-anchor="end">v</text>
