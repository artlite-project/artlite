<svg xmlns="http://www.w3.org/2000/svg" width="880" height="356" viewBox="0 0 880 356" role="img" aria-labelledby="t d">
<title id="t">Program memory of an sd15 core</title>
<desc id="d">A core has 16 KB of program memory. sd15's cores need 34192 bytes of code in all: 8976 bytes of resident code (startup, main loop, GEMM and convolution, the pager) and five roles' code, which together do not fit. As pages, each role is linked at the slot, the 7408 bytes after the resident code, and only one is loaded at a time: attention with heads of 80 and 160 (5776 bytes), attention with heads of 40 (5216), the VAE's attention (3360), GroupNorm (4880), LayerNorm with GEGLU (5984).</desc>
<style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif}.eb{font-size:10px;font-weight:700;letter-spacing:.1em;fill:#6e7681}.ti{font-size:11.5px;font-weight:600;fill:#f0f6fc}.st{font-size:11px;font-weight:700;fill:#f0f6fc}.lb{font-size:10.5px;fill:#9198a1}.pl{font-size:10px;fill:#9198a1}.sb{font-size:10px;fill:#9198a1}.en{font-size:10.5px;fill:#6e7681}.c{font-size:10px;fill:#f0f6fc}.bn{font-size:10px;font-weight:700}.mo,.sm,.mm{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;font-size:9.5px;fill:#f0f6fc}.sm{font-size:10px;fill:#9198a1}.mm{font-size:10px;fill:#6e7681}.halo,.halop,.halot{paint-order:stroke;stroke:#0d1117;stroke-width:5px;stroke-linejoin:round}.halop{stroke:#151b23}.halot{stroke:#1f252d}.panel{fill:#151b23;stroke:#3d444d}.tile{fill:#1f252d;stroke:#3d444d}.card{fill:#0d1117;stroke:#3d444d}.a,.w{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.w.ctl,.a.ctl{stroke-width:1.3}.hatch{fill:url(#hatch);stroke:#3d444d}.slot{fill:#0d1117;stroke:#d95926;stroke-dasharray:4 3}.axis{fill:none;stroke:#3d444d}.guide{fill:none;stroke:#3d444d;stroke-dasharray:3 3}.resident{fill:#1d2128;stroke:#4f545c}.gcore{fill:#3987e5}.gmem{fill:#214674}.gshim{fill:#0d1117;stroke:#6e7681}.a.data,.w.data{stroke:#3987e5}.a.data{marker-end:url(#hdata)}.card.data{fill:#111d2c;stroke:#255288}.port.data{fill:#142438;stroke:#3987e5}.buf.data{fill:#162940}.solid.data{fill:#3987e5}.badge.data{fill:#3987e5;stroke:#0d1117;stroke-width:2px}.bn.data{fill:#ffffff}.a.code,.w.code{stroke:#d95926}.a.code{marker-end:url(#hcode)}.card.code{fill:#211818;stroke:#7d391f}.port.code{fill:#2e1d19;stroke:#d95926}.buf.code{fill:#361f1a}.solid.code{fill:#d95926}.badge.code{fill:#d95926;stroke:#0d1117;stroke-width:2px}.bn.code{fill:#ffffff}.a.wts,.w.wts{stroke:#199e70}.a.wts{marker-end:url(#hwts)}.card.wts{fill:#0e1f20;stroke:#145f48}.port.wts{fill:#0f2825;stroke:#199e70}.buf.wts{fill:#0f2d29}.solid.wts{fill:#199e70}.badge.wts{fill:#199e70;stroke:#0d1117;stroke-width:2px}.bn.wts{fill:#0d1117}.a.ctl,.w.ctl{stroke:#9198a1}.a.ctl{marker-end:url(#hctl)}.card.ctl{fill:#1a1e25;stroke:#565b63}.port.ctl{fill:#22272d;stroke:#9198a1}.buf.ctl{fill:#272c33}.solid.ctl{fill:#9198a1}.badge.ctl{fill:#9198a1;stroke:#0d1117;stroke-width:2px}.bn.ctl{fill:#0d1117}</style>
<defs><marker id="hdata" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1L9,5L1,9L3.2,5z" fill="#3987e5"/></marker><marker id="hcode" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1L9,5L1,9L3.2,5z" fill="#d95926"/></marker><marker id="hwts" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1L9,5L1,9L3.2,5z" fill="#199e70"/></marker><marker id="hctl" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1L9,5L1,9L3.2,5z" fill="#9198a1"/></marker><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#0d1117"/><line x1="0" y1="0" x2="0" y2="5" stroke="#3d444d" stroke-width="1.6"/></pattern></defs>
<rect x="0.5" y="0.5" width="879" height="355" rx="8" fill="#0d1117" stroke="#3d444d"/>
