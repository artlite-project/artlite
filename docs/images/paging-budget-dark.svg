<text x="372.25" y="101" class="c" text-anchor="middle">resident</text>
<rect x="514.5" y="84" width="178.5" height="26" rx="4" class="card code"/>
<text x="603.75" y="101" class="mo" text-anchor="middle">a</text>
<rect x="695" y="84" width="49" height="26" rx="4" class="card code"/>
<text x="719.5" y="101" class="mo" text-anchor="middle">c</text>
<path d="M744,78l5,9.5l-10,9.5l10,9.5l-5,9.5" class="w ctl"/>
<text x="760" y="95" class="lb">34192 B in all:</text>
<text x="760" y="110" class="lb">2.1 × the memory</text>
