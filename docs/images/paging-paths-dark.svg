<text x="96" y="272" class="mm" text-anchor="middle">shim (0, 0)</text>
<rect x="160" y="56" width="112" height="140" rx="10" class="tile"/>
<text x="172" y="74" class="mm">core (1, 2)</text>
<rect x="170" y="84" width="92" height="26" rx="5" class="card code"/>
<text x="216" y="101" class="c" text-anchor="middle">program memory</text>
<path d="M216,188L216,112" class="a code"/>
<path d="M216,220L216,206" class="a code"/>
<rect x="177.127" y="188" width="77.745" height="16" rx="4" class="port code"/>
