<rect x="304" y="244" width="112" height="40" rx="10" class="tile"/>
<text x="360" y="272" class="mm" text-anchor="middle">shim (7, 0)</text>
<path d="M96,220L360,220" class="w code"/>
<path d="M216,236L216,220" class="w code"/>
<text x="288" y="223" class="pl halop" text-anchor="middle">control packets</text>
<rect x="191.615" y="236" width="48.77" height="16" rx="4" class="port code"/>
<text x="216" y="247.4" class="mo" text-anchor="middle">MM2S 1</text>
<rect x="160" y="308" width="112" height="40" rx="6" class="card"/>
<text x="216" y="325" class="ti" text-anchor="middle">DDR</text>
<text x="216" y="340" class="sb" text-anchor="middle">the role's code</text>
<path d="M216,308L216,254" class="a code"/>
<circle cx="49" cy="372" r="8.5" class="badge ctl"/>
<text x="49" y="375.6" class="bn ctl" text-anchor="middle">1</text>
<text x="66" y="376" class="st">Wait</text>
<text x="95.54" y="376" class="lb">until the row's ops are complete</text>
<circle cx="49" cy="392" r="8.5" class="badge ctl"/>
<text x="49" y="395.6" class="bn ctl" text-anchor="middle">2</text>
<text x="66" y="396" class="st">Push</text>
<text x="98.8238" y="396" class="lb">shim 1 sends the packets</text>
<circle cx="49" cy="412" r="8.5" class="badge ctl"/>
<text x="49" y="415.6" class="bn ctl" text-anchor="middle">3</text>
<text x="66" y="416" class="st">Poll</text>
<text x="91.6206" y="416" class="lb">every core's marker word</text>
<rect x="448" y="24" width="408" height="408" rx="10" class="panel"/>
<text x="462" y="44" class="eb">THE CORE LOADS ITS PAGE</text>
<text x="631.555" y="44" class="en">nothing waits</text>
<text x="712" y="134" class="ti" text-anchor="middle">…</text>
<rect x="464" y="56" width="112" height="140" rx="10" class="tile"/>
