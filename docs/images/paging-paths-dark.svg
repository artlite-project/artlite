<text x="316" y="74" class="mm">core (7, 2)</text>
<rect x="314" y="84" width="92" height="26" rx="5" class="card code"/>
<text x="360" y="101" class="c" text-anchor="middle">program memory</text>
<path d="M360,188L360,112" class="a code"/>
<path d="M360,220L360,206" class="a code"/>
<rect x="321.127" y="188" width="77.745" height="16" rx="4" class="port code"/>
