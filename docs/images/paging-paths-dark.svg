<text x="784" y="101" class="c" text-anchor="middle">program memory</text>
<rect x="738" y="124" width="92" height="24" rx="5" class="card code"/>
<text x="784" y="140" class="mo" text-anchor="middle">TileControl</text>
<rect x="738" y="160" width="52" height="20" rx="4" class="buf wts"/>
<text x="764" y="173.5" class="mo" text-anchor="middle">slots</text>
