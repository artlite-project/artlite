[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=2.12.0"]
build-backend = "scikit_build_core.build"

[project]
name = "artlite"
version = "0.1.0"
description = "Lightweight NPU runtime for AMD Ryzen AI"
readme = "README.md"
license = "LGPL-2.1-or-later AND Apache-2.0 AND GPL-2.0-only WITH Linux-syscall-note"  # csrc/shim_xdna: its LICENSE
license-files = ["LICENSE", "csrc/shim_xdna/LICENSE"]
requires-python = ">=3.12,<3.15"  # the pinned mlir_aie's wheels: 3.12-3.14
# Everything artlite-cli, artlite-server (its web chat included), artlite-bench and artlite-probe run on; tools for
# working on Artlite are the dev group.
dependencies = [
    "mlir_aie==1.4.6.dev15+ge5a3fa1",
    "llvm_aie==22.0.0.2026111101+81af12b7",
    "numpy>=2",  # NEP 50 promotion: the host's float32 arithmetic stays float32
    "ml-dtypes>=0.4",  # (the first built for numpy 2)
    "pyyaml>=6.0.3",
    "gguf>=0.19.0",
    "jinja2>=3.1.6",
    "gigatoken>=0.10.0",  # the tokenizers
    "pillow>=11.0",  # image input: decoding, and the bicubic resampling of the models' training
    "miniaudio>=1.71",  # audio input: containers besides WAV, resampling (llama.cpp's mtmd decodes with it)
    "fastapi>=0.115",
    "starlette",
    "pydantic>=2",
    "anyio",
    "uvicorn>=0.32",
    "httpx>=0.28",  # artlite-server's router mode: the proxy to the models' servers
    "python-multipart>=0.0.20",  # artlite-server's /v1/audio/transcriptions (multipart forms)
    "websockets>=15.0",  # artlite-server's /v1/realtime (uvicorn's websocket protocol)
]

[project.urls]
Repository = "https://github.com/artlite-project/artlite"
Documentation = "https://github.com/artlite-project/artlite/tree/main/docs"
Issues = "https://github.com/artlite-project/artlite/issues"

[project.scripts]
artlite-cli = "models.cli:main"
artlite-bench = "models.bench:main"
artlite-server = "models.server.main:main"
artlite-probe = "models.probe:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.16.2",
    "openai>=1.60",  # tests/server: the API through the official clients
    "anthropic>=0.60",
    "scikit-build-core>=0.11",  # the rebuild without build isolation (docs/install.md)
    "nanobind>=2.12.0",
    "torch>=2.11.0",  # the tests' CPU references (production code runs on numpy and ml_dtypes)
]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build"
wheel.packages = ["src/artlite", "src/models"]

[tool.uv]
find-links = [
    "https://github.com/Xilinx/mlir-aie/releases/expanded_assets/latest-wheels-4",
    "https://github.com/Xilinx/llvm-aie/releases/expanded_assets/nightly",
]
# uv sync rebuilds the native module when its sources change (the editable install keeps the Python files in place)
cache-keys = [{ file = "pyproject.toml" }, { file = "CMakeLists.txt" }, { file = "csrc/**/*" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest]
testpaths = ["tests"]
markers = [
    "slow: whole-model tests (minutes each); skipped unless --run-slow or -m slow",
    "smoke: the quick check after a change (conftest.SMOKE): host tests and one NPU case per component",
]

[tool.ruff]
line-length = 120  # the style's width (import sorting wraps at it); long lines are not reported
force-exclude = true  # (so that the format exclusion also holds for files named on the command line)

[tool.ruff.lint]
# ruff's default rule set (pyflakes, bugbear, pyupgrade, isort, pylint errors, ...) plus checks of AGENTS.md rules,
# each clean on the whole tree: `ruff check` reports only what a change introduced. Not checked, since the tree
# does not follow them: line length (E501), fully unannotated functions (IRON worker / sequence callbacks),
# positional parameters beyond 3 (PLR0917: public signatures, positional IRON callbacks).
extend-select = [
    "ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206",  # see flake8-annotations
    "E711", "E712", "E713", "E714", "E721",  # comparisons with None / True, `not in`, type()
    "TID251",  # banned imports (below)
]

[tool.ruff.lint.flake8-annotations]
ignore-fully-untyped = true  # a function with any annotation must annotate every parameter and its return value
suppress-none-returning = true  # (but `-> None` is not required)
mypy-init-return = true

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"iron".msg = "never import IRON operators: Artlite operators are self-contained (aie.iron is fine)"
"torch".msg = "production code imports no torch: numpy and ml_dtypes on the host (tests/ may use torch)"

[tool.ruff.format]
exclude = ["*"]  # the tree is not uniformly formatted: `ruff format` must not rewrite whole files
